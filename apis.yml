aid: creopop
name: Creopop
description: CreoPop is a consumer 3D-printing pen that lets you draw three-dimensional objects freehand.
  Unlike filament 3D pens it has no hot parts or melting plastic; instead it uses photopolymer "cool ink"
  cartridges that are solidified by built-in LEDs, and it is battery operated and charged over mini-USB. The
  product line includes specialty inks (elastic, magnetic, glow-in-the-dark, aromatic, temperature-sensitive,
  and electrically conductive). CreoPop is a hardware/consumer-electronics brand with a marketing and
  direct-to-consumer e-commerce website; it publishes no public API, developer portal, or documentation.
